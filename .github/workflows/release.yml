# The release pipeline pushes a version tag after Piglet delivers the release commit.
name: release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: terraform-provider-release
  queue: max
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Validate release tag and changelog
        id: release
        shell: bash
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_REF" =~ ^refs/tags/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Expected a version tag, got $RELEASE_REF" >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          tag="v$version"
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The push event does not contain a usable release commit: $RELEASE_SHA" >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]]; then
            echo "Checkout is not at the tagged commit $RELEASE_SHA" >&2
            exit 1
          fi
          parent="$(git rev-parse HEAD^)"

          changed_paths="$(git diff --diff-filter=A --name-only "$parent" "$RELEASE_SHA" -- .changes)"
          changelogs=()
          while IFS= read -r path; do
            if [[ "$path" =~ ^\.changes/[0-9]+\.[0-9]+\.[0-9]+\.md$ ]]; then
              changelogs+=("$path")
            fi
          done <<< "$changed_paths"

          if (( ${#changelogs[@]} != 1 )); then
            echo "Expected one new versioned changelog, found ${#changelogs[@]}:" >&2
            printf '  %s\n' "${changelogs[@]}" >&2
            exit 1
          fi

          changelog="${changelogs[0]}"
          if [[ "$changelog" != ".changes/$version.md" ]]; then
            echo "Tag $tag does not match the new changelog $changelog" >&2
            exit 1
          fi
          if ! grep -Eq "^## ${version//./\\.}( \\(|$)" "$changelog"; then
            echo "$changelog does not start a section for version $version" >&2
            exit 1
          fi

          {
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Inspect release and tag
        id: state
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          api_error="$(mktemp)"
          release_state=absent
          if release_draft="$(gh api "/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq .draft 2>"$api_error")"; then
            case "$release_draft" in
              false) release_state=published ;;
              true) echo "Release $RELEASE_TAG is a draft; refusing to replace it" >&2; exit 1 ;;
              *) echo "Unexpected release state: $release_draft" >&2; exit 1 ;;
            esac
          elif ! grep -q '(HTTP 404)' "$api_error"; then
            cat "$api_error" >&2
            exit 1
          fi
          rm -f "$api_error"

          remote_tag="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
          tag_commit="$(printf '%s\n' "$remote_tag" | awk -v ref="refs/tags/$RELEASE_TAG^{}" '$2 == ref {print $1}')"
          if [[ -z "$tag_commit" ]]; then
            tag_commit="$(printf '%s\n' "$remote_tag" | awk -v ref="refs/tags/$RELEASE_TAG" '$2 == ref {print $1}')"
          fi
          if [[ ! "$tag_commit" =~ ^[0-9a-f]{40}$ || "$tag_commit" != "$RELEASE_SHA" ]]; then
            echo "Tag $RELEASE_TAG does not point to the release commit $RELEASE_SHA" >&2
            exit 1
          fi

          if [[ "$release_state" == "published" ]]; then
            assets="$(gh api "/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.assets[] | select(.state == "uploaded" and .size > 0) | .name')"
            checksum="terraform-provider-yandex_${RELEASE_TAG#v}_SHA256SUMS"
            expected=("$checksum" "$checksum.sig")
            for goos in freebsd windows linux darwin; do
              for arch in amd64 386 arm arm64; do
                if [[ "$goos:$arch" == "darwin:386" || "$goos:$arch" == "darwin:arm" || "$goos:$arch" == "windows:arm64" ]]; then
                  continue
                fi
                expected+=("terraform-provider-yandex_${RELEASE_TAG#v}_${goos}_${arch}.zip")
              done
            done
            for name in "${expected[@]}"; do
              if ! grep -Fxq "$name" <<< "$assets"; then
                echo "Published release $RELEASE_TAG is incomplete: missing $name" >&2
                exit 1
              fi
            done
            release_dir="$(mktemp -d)"
            trap 'rm -rf "$release_dir"' EXIT
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$checksum" --dir "$release_dir"
            for name in "${expected[@]:2}"; do
              if ! awk -v name="$name" '$2 == name && length($1) == 64 && $1 ~ /^[0-9a-fA-F]+$/ {found++} END {exit found != 1}' "$release_dir/$checksum"; then
                echo "Published release $RELEASE_TAG has no valid checksum for $name" >&2
                exit 1
              fi
            done
            echo "GitHub release $RELEASE_TAG is already published at $RELEASE_SHA."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: CLEAN-UP
        if: steps.state.outputs.publish == 'true'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Set up Go
        if: steps.state.outputs.publish == 'true'
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.10'
          cache: false

      - name: Import GPG key
        if: steps.state.outputs.publish == 'true'
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Run GoReleaser
        if: steps.state.outputs.publish == 'true'
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '1.26'
          args: release --rm-dist --timeout 45m
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.release.outputs.tag }}
