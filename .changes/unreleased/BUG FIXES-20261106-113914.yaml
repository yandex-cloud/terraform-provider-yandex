kind: BUG FIXES
body: 'postgresql: do not wait for host roles before adding, updating or deleting hosts of `yandex_mdb_postgresql_cluster`: these steps do not use the roles, and a host in `ROLE_UNKNOWN` state made each of them wait about two minutes. Before a failover only the role of the target host is awaited, and a failover to a host that does not report its role is no longer started: such a task fails in the worker and leaves the cluster in `MODIFY-ERROR`'
time: 2026-11-06T11:39:14.686525+01:00
